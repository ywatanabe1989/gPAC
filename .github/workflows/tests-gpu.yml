name: pytest-gpu

# GPU + slow test suite runs on a self-hosted runner with an NVIDIA GPU.
# This workflow is currently disabled (if: false) — the operator will
# enable it once the self-hosted runner is wired up. Keep the workflow
# in the repo so the test command stays under version control and so
# the marker convention has a documented landing zone.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

jobs:
  gpu-test:
    # NOTE: switch to ``runs-on: [self-hosted, gpu]`` and ``if: true``
    # once the runner is provisioned.
    if: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with CUDA torch
        run: |
          python -m pip install --upgrade pip
          # On the GPU runner this should resolve to the CUDA-enabled wheel.
          pip install torch
          pip install -e ".[testing]"

      - name: Confirm CUDA is visible
        run: |
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA not visible on the runner'"

      - name: Run GPU + slow tests
        run: |
          pytest tests/ -v -m "gpu or slow" \
            --cov=src/gpac --cov-report=xml --cov-report=term \
            --ignore=tests/gpac/.old \
            --ignore=tests/comparison_with_tensorpac

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: gpu
          fail_ci_if_error: false
