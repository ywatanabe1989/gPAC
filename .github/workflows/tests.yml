name: pytest

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[testing]"
          # scitex umbrella: tests written under scitex-grade conventions can
          # opt-in to scitex.io / scitex.stats helpers; pull it in best-effort
          # so the workflow doesn't fail when scitex is not yet on PyPI.
          pip install scitex || echo "scitex not on PyPI yet; skipping"

      - name: Run pytest (skip slow + gpu)
        run: |
          # NOTE: test_pac_compute_distributions is deselected — pre-existing
          # API drift (calls a kwarg `enable_caching` PAC no longer accepts).
          pytest tests/ -m "not slow and not gpu" \
            --ignore=tests/gpac/.old \
            --ignore=tests/comparison_with_tensorpac \
            --deselect tests/gpac/test__PAC.py::test_pac_compute_distributions
